<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>函数绘图器</title>
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1c212b; --line:#262c38;
    --fg:#e6e9ef; --dim:#8b95a7; --accent:#4c8dff; --ok:#3ddc97; --err:#ff6b6b;
    --radius:12px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea;
      --fg:#1b1f27; --dim:#6b7280; --accent:#2563eb; --ok:#0a8f5b; --err:#dc2626;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  #app{display:flex;flex-direction:column;height:100dvh}
  #stage{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  /* 曲线画在 #cv 上（只在视图变化时重绘），标记点画在 #ov 上（跟着手指高频重绘） */
  #ov{position:absolute;inset:0;pointer-events:none;z-index:2}
  @supports (padding: env(safe-area-inset-top)){
    #stage{padding-top:env(safe-area-inset-top)}
  }

  /* 右上角工具按钮 */
  #tools{
    position:absolute;right:10px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:7px;z-index:5;
  }
  #tools button{
    width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px #0003;
  }
  #tools button.on{border-color:var(--accent);color:var(--accent)}
  #tools button.small{font-size:11px}

  /* 坐标提示 */
  #tip{
    position:absolute;display:none;z-index:8;pointer-events:none;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:7px 11px;font:12.5px/1.5 ui-monospace,Menlo,monospace;
    white-space:pre;box-shadow:0 6px 20px #0004;color:var(--fg);
  }

  /* 底部函数面板 */
  #panel{
    background:var(--panel);border-top:1px solid var(--line);
    max-height:52vh;display:flex;flex-direction:column;
    box-shadow:0 -6px 24px #0002;
  }
  #panel.collapsed{max-height:48px}
  #panel.collapsed #list,#panel.collapsed #sampleBox{display:none}
  #phead{
    display:flex;align-items:center;gap:8px;padding:9px 12px;min-height:48px;
    border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #phead .t{font-size:13.5px;font-weight:600;letter-spacing:.2px}
  #phead .badge{
    font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:1px 7px;line-height:15px;
  }
  #phead .grow{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    padding:7px 12px;border-radius:10px;font-size:12.5px;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}

  #list{overflow:auto;padding:4px 10px;flex:0 1 auto}
  .frow{
    display:flex;align-items:center;gap:7px;padding:7px 2px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .frow:last-child{border-bottom:none}
  .frow.off{opacity:.4}
  .frow.err .fx{border-color:var(--err);background:color-mix(in srgb, var(--err) 8%, var(--panel2))}
  .dot{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
    cursor:pointer;flex:0 0 auto;transition:.15s;
  }
  .dot:hover{transform:scale(1.12)}
  .mode{
    background:var(--panel2);color:var(--dim);border:1px solid var(--line);
    border-radius:8px;padding:6px 3px;font-size:11.5px;flex:0 0 auto;
  }
  .fx{
    flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:9px;padding:8px 10px;
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;
  }
  .fx:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
  .del{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--dim);cursor:pointer;font-size:16px;flex:0 0 auto;
  }
  .del:hover{color:var(--err);border-color:var(--err)}
  .errmsg{width:100%;font-size:11.5px;color:var(--err);padding-left:32px;margin-top:-2px}
  .errmsg:empty{display:none}

  /* 示例库：默认收起 */
  details#sampleBox{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel)}
  details#sampleBox > summary{
    display:flex;align-items:center;gap:7px;padding:10px 12px;
    font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none;
  }
  details#sampleBox > summary::before{content:"▸";font-size:10px;transition:.15s}
  details#sampleBox[open] > summary::before{transform:rotate(90deg)}
  details#sampleBox[open] > summary{color:var(--fg);border-bottom:1px solid var(--line)}
  details#sampleBox .cnt{
    font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:0 6px;line-height:16px;
  }
  details#sampleBox .hint{margin-left:auto;font-size:11px;color:var(--dim);opacity:.8}
  #samples{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 14px;max-height:30vh;overflow:auto}
  .smp{
    font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer;font-family:inherit;
  }
  .smp:hover{border-color:var(--accent);color:var(--accent)}

  @media (min-width:900px){
    #app{flex-direction:row}
    #stage{flex:1}
    #panel{width:390px;max-height:none;border-top:none;border-left:1px solid var(--line)}
    #panel.collapsed{max-height:none;width:44px}
    #panel.collapsed #phead{writing-mode:vertical-rl}
    #panel.collapsed #phead .t{writing-mode:vertical-rl}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="ov"></canvas>
    <div id="tools">
      <button id="zin" title="放大">＋</button>
      <button id="zout" title="缩小">－</button>
      <button id="gridbtn" class="on small" title="网格">网格</button>
      <button id="themebtn" class="small" title="配色">跟随系统</button>
      <button id="zreset" title="复位">⌂</button>
    </div>
    <div id="tip"></div>
  </div>

  <div id="panel">
    <div id="phead">
      <span class="t">函数</span>
      <span class="badge" id="fnCount">0</span>
      <span class="grow"></span>
      <button class="btn" id="togglePanel">收起/展开</button>
      <button class="btn primary" id="addfn">＋ 添加</button>
    </div>
    <div id="list"></div>
    <details id="sampleBox">
      <summary>示例库<span class="cnt" id="sampleCnt">33</span><span class="hint">点击即添加</span></summary>
      <div id="samples"></div>
    </details>
  </div>
</div>

<script src="parser.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
